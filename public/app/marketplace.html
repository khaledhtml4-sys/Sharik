<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>سوق المهارات | شارك</title><meta name="description" content="اكتشف مهارات متنوعة في سوق شارك. تعلم من الخبراء أو انشر مهارتك." /><meta name="robots" content="noindex, follow" /><link rel="icon" href="/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="/saas/saas.css" />
<link rel="stylesheet" href="/tria-theme.css"><script src="/config.js"></script><style> .mkt-layout { padding: 0 24px 48px; max-width: 1200px; margin: 0 auto; } .mkt-search-bar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; } .mkt-search { flex: 1; min-width: 200px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--saas-border); background: var(--saas-surface); color: var(--saas-text); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; } .mkt-search:focus { border-color: #b57bee; } .filter-select { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--saas-border); background: var(--saas-surface); color: var(--saas-text); font-family: inherit; font-size: 14px; cursor: pointer; } /* Skill Grid */ .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; } /* Skill Card */ .skill-card { background: var(--saas-surface); border: 1px solid var(--saas-border); border-radius: 16px; overflow: hidden; transition: all 0.25s; cursor: pointer; animation: fadeUp 0.3s ease both; display: flex; flex-direction: column; } .skill-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: rgba(181,123,238,0.3); } @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} } .skill-cover { height: 140px; background: linear-gradient(135deg, #211833, #120c1e); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; } .skill-cover img { width: 100%; height: 100%; object-fit: cover; } .skill-cover-icon { font-size: 48px; } .skill-cover-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); } .skill-premium-badge { position: absolute; top: 10px; right: 10px; padding: 3px 10px; border-radius: 20px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; font-size: 11px; font-weight: 700; } .skill-body { padding: 16px; flex: 1; display: flex; flex-direction: column; } .skill-category { font-size: 11px; font-weight: 700; color: #b57bee; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; } .skill-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; } .skill-desc { font-size: 13px; color: var(--saas-muted); margin-bottom: 12px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .skill-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--saas-muted); margin-bottom: 12px; flex-wrap: wrap; } .skill-meta-item { display: flex; align-items: center; gap: 4px; } .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; } .skill-tag { padding: 3px 8px; border-radius: 6px; background: rgba(181,123,238,0.1); border: 1px solid rgba(181,123,238,0.2); color: #d3a4ef; font-size: 11px; } .skill-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--saas-border); padding-top: 12px; margin-top: auto; } .skill-author { display: flex; align-items: center; gap: 8px; font-size: 12px; } .skill-author-ava { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #b57bee, #8b4fd6); display: flex; align-items: center; justify-content: center; font-size: 11px; } .stars { color: #f59e0b; font-size: 13px; } /* Publish Modal */ .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 0.2s ease; } @keyframes fadeIn { from{opacity:0} to{opacity:1} } .modal { background: var(--bg, #120c1e); border: 1px solid var(--saas-border); border-radius: 20px; padding: 28px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; position: relative; } .modal-close { position: absolute; top: 16px; left: 16px; background: none; border: none; color: var(--saas-muted); cursor: pointer; font-size: 20px; } .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; } .form-group { margin-bottom: 16px; } .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--saas-muted); margin-bottom: 6px; } .form-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--saas-border); background: var(--saas-surface); color: var(--saas-text); font-family: inherit; font-size: 14px; outline: none; box-sizing: border-box; } .form-input:focus { border-color: #b57bee; } .form-textarea { resize: vertical; min-height: 100px; } .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } /* Detail Modal */ .detail-cover { height: 200px; background: linear-gradient(135deg, #2f2150, #120c1e); border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 64px; overflow: hidden; } .detail-cover img { width: 100%; height: 100%; object-fit: cover; } .learn-point { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; } .empty-mkt { text-align: center; padding: 60px; color: var(--saas-muted); } .load-more-wrap { text-align: center; margin-top: 24px; } </style>  <script src="/i18n.js" defer></script><script src="/toast.js" defer></script>
</head><body class="dark saas-app"><div id="saas-root"></div><script src="/saas/saas-shell.js"></script><script> (async function () { const S = window.SharikSaaS; if (!S.requireAuth()) return; const content = S.mountShell("marketplace"); if (!content) return; let page = 1, hasMore = true, loading = false; let filters = { q: '', level: '', category: '', isPremium: '' }; function escapeHtml(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } const levelLabels = { beginner: 'مبتدئ', intermediate: 'متوسط', advanced: 'متقدم', all: 'الكل' }; const levelColors = { beginner: '#10b981', intermediate: '#f59e0b', advanced: '#ef4444', all: '#b57bee' }; const categoryIcons = { Technology: '💻', Design: '🎨', Business: '📊', Language: '🌍', Science: '🔬', Art: '🎭', Music: '🎵', Other: '📦', }; function stars(avg) { const full = Math.floor(avg), half = avg % 1 >= 0.5 ? 1 : 0, empty = 5 - full - half; return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty); } content.innerHTML = ` <div class="mkt-layout"><div class="saas-page-head"><div><h1>🛒 سوق المهارات</h1><p>اكتشف مهارات يشاركها الخبراء أو انشر مهارتك لتعليم الآخرين</p></div><button class="saas-btn saas-btn-primary" onclick="openPublishModal()">+ انشر مهارة</button></div><div class="mkt-search-bar"><input class="mkt-search" id="searchInput" type="search" placeholder="ابحث عن مهارة..." /><select class="filter-select" id="filterCategory" onchange="applyFilters()"><option value="">جميع الفئات</option><option value="Technology">💻 التقنية</option><option value="Design">🎨 التصميم</option><option value="Business">📊 الأعمال</option><option value="Language">🌍 اللغات</option><option value="Science">🔬 العلوم</option></select><select class="filter-select" id="filterLevel" onchange="applyFilters()"><option value="">جميع المستويات</option><option value="beginner">مبتدئ</option><option value="intermediate">متوسط</option><option value="advanced">متقدم</option></select><select class="filter-select" id="filterPremium" onchange="applyFilters()"><option value="">الكل</option><option value="false">مجاني</option><option value="true">مميز</option></select></div><div class="skills-grid" id="skillsGrid"> ${[1,2,3,4,5,6].map(() => ` <div class="skill-card"><div class="skill-cover"><div class="skeleton" style="width:100%;height:100%"></div></div><div class="skill-body"><div class="skeleton" style="height:12px;width:80px;margin-bottom:8px"></div><div class="skeleton" style="height:18px;margin-bottom:8px"></div><div class="skeleton" style="height:40px;margin-bottom:12px"></div><div class="skeleton" style="height:14px;width:200px"></div></div></div> `).join('')} </div><div class="load-more-wrap" id="loadMoreWrap" style="display:none"><button class="saas-btn saas-btn-ghost" onclick="loadMore()">تحميل المزيد</button></div></div> `; /* Search debounce */ let searchTimer; document.getElementById('searchInput').addEventListener('input', (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { filters.q = e.target.value.trim(); resetAndLoad(); }, 400); }); window.applyFilters = function() { filters.category = document.getElementById('filterCategory').value; filters.level = document.getElementById('filterLevel').value; filters.isPremium = document.getElementById('filterPremium').value; resetAndLoad(); }; function resetAndLoad() { page = 1; hasMore = true; document.getElementById('skillsGrid').innerHTML = ''; loadSkills(); } async function loadSkills() { if (loading || !hasMore) return; loading = true; try { const params = new URLSearchParams({ page, limit: 12 }); if (filters.q) params.set('q', filters.q); if (filters.category) params.set('category', filters.category); if (filters.level) params.set('level', filters.level); if (filters.isPremium !== '') params.set('isPremium', filters.isPremium); const data = await S.api(`/api/marketplace/skills?${params}`); hasMore = data.hasMore; page++; const grid = document.getElementById('skillsGrid'); if (data.skills.length === 0 && page === 2) { grid.innerHTML = `<div class="empty-mkt" style="grid-column:1/-1"><div style="font-size:48px;margin-bottom:12px">🔍</div><h3>لا توجد مهارات</h3><p>كن أول من ينشر مهارة!</p></div>`; } else { data.skills.forEach(s => grid.insertAdjacentHTML('beforeend', renderSkillCard(s))); } document.getElementById('loadMoreWrap').style.display = hasMore ? 'block' : 'none'; } catch (err) { document.getElementById('skillsGrid').innerHTML = `<div class="empty-mkt" style="grid-column:1/-1">تعذّر التحميل. <button class="saas-btn saas-btn-ghost" onclick="resetAndLoad()">إعادة المحاولة</button></div>`; } finally { loading = false; } } function renderSkillCard(s) { const avgRating = s.averageRating || 0; const icon = categoryIcons[s.category] || '📦'; const levelColor = levelColors[s.level] || '#b57bee'; return ` <div class="skill-card" onclick="openSkillDetail('${s._id}')"><div class="skill-cover"> ${s.coverImageUrl ? `<img loading="lazy" decoding="async" src="${escapeHtml(s.coverImageUrl)}" alt="${escapeHtml(s.title)}"  />` : `<div class="skill-cover-icon">${icon}</div>`} <div class="skill-cover-overlay"></div> ${s.isPremium ? '<span class="skill-premium-badge">⭐ مميز</span>' : ''} </div><div class="skill-body"><div class="skill-category" style="color:${levelColor}">${escapeHtml(s.category)} • ${levelLabels[s.level] || s.level}</div><div class="skill-title">${escapeHtml(s.title)}</div><div class="skill-desc">${escapeHtml(s.description)}</div><div class="skill-meta"><span class="skill-meta-item">⏱️ ${s.duration} دقيقة</span><span class="skill-meta-item">📅 ${s.sessionCount} جلسات</span><span class="skill-meta-item">🌍 ${escapeHtml(s.language)}</span></div> ${(s.tags || []).length > 0 ? `<div class="skill-tags">${s.tags.slice(0,4).map(t => `<span class="skill-tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''} <div class="skill-footer"><div class="skill-author"><div class="skill-author-ava">👤</div><span>${escapeHtml(s.ownerName || 'مجهول')}</span></div> ${avgRating > 0 ? `<div><span class="stars">${stars(avgRating)}</span><small style="color:var(--saas-muted)">(${s.reviews?.length || 0})</small></div>` : '<span style="color:var(--saas-muted);font-size:12px">جديد</span>'} </div></div></div> `; } /* Skill detail modal */ window.openSkillDetail = async function(id) { const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.innerHTML = `<div class="modal"><div style="text-align:center;padding:40px"><div class="spinner" style="width:40px;height:40px;border:3px solid rgba(181,123,238,0.3);border-top-color:#b57bee;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto"></div></div></div>`; document.body.appendChild(overlay); overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); }); try { const data = await S.api(`/api/marketplace/skills/${id}`); const s = data.skill; const avgRating = s.averageRating || 0; overlay.querySelector('.modal').innerHTML = ` <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button><div class="detail-cover"> ${s.coverImageUrl ? `<img loading="lazy" decoding="async" src="${escapeHtml(s.coverImageUrl)}" alt="">` : `<span style="font-size:64px">${categoryIcons[s.category] || '📦'}</span>`} </div><span class="saas-badge" style="background:${levelColors[s.level] || '#b57bee'};color:white;margin-bottom:12px;display:inline-block">${levelLabels[s.level] || s.level}</span><h2 style="font-size:22px;font-weight:800;margin-bottom:8px">${escapeHtml(s.title)}</h2><p style="color:var(--saas-muted);font-size:13px;margin-bottom:16px">بواسطة ${escapeHtml(s.ownerName)} • ${s.enrolledCount} مسجل • ${s.viewCount} مشاهدة</p> ${avgRating > 0 ? `<div style="margin-bottom:16px"><span class="stars">${stars(avgRating)}</span><span style="color:var(--saas-muted);font-size:13px">${avgRating} (${s.reviews?.length || 0} تقييم)</span></div>` : ''} <div style="font-size:14px;line-height:1.8;color:var(--saas-muted);margin-bottom:20px">${escapeHtml(s.description)}</div><div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap"><div class="meta-card" style="padding:12px 16px"><div style="font-weight:700">⏱️ ${s.duration}</div><div style="font-size:12px;color:var(--saas-muted)">دقيقة/جلسة</div></div><div class="meta-card" style="padding:12px 16px"><div style="font-weight:700">📅 ${s.sessionCount}</div><div style="font-size:12px;color:var(--saas-muted)">جلسات</div></div><div class="meta-card" style="padding:12px 16px"><div style="font-weight:700">🌍 ${escapeHtml(s.language)}</div><div style="font-size:12px;color:var(--saas-muted)">اللغة</div></div></div> ${(s.whatYouLearn || []).length > 0 ? ` <h4 style="font-weight:700;margin-bottom:10px">ماذا ستتعلم:</h4> ${s.whatYouLearn.map(p => `<div class="learn-point">✅ ${escapeHtml(p)}</div>`).join('')} <div style="margin-bottom:20px"></div> ` : ''} ${(s.tags || []).length > 0 ? `<div class="skill-tags" style="margin-bottom:20px">${s.tags.map(t => `<span class="skill-tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''} <a href="/login-signup/matching-results.html" class="saas-btn saas-btn-primary" style="width:100%;display:block;text-align:center;padding:14px;text-decoration:none">🤝 طلب تبادل هذه المهارة</a> `; } catch (err) { overlay.querySelector('.modal').innerHTML = '<div style="text-align:center;padding:40px;color:var(--saas-muted)">تعذّر التحميل</div>'; } }; /* Publish Modal */ window.openPublishModal = function() { const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.innerHTML = ` <div class="modal"><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button><div class="modal-title">📝 انشر مهارة جديدة</div><div class="form-group"><label class="form-label">عنوان المهارة *</label><input class="form-input" id="pubTitle" placeholder="مثال: تعلم React.js من الصفر" /></div><div class="form-group"><label class="form-label">الوصف *</label><textarea class="form-input form-textarea" id="pubDesc" placeholder="اشرح ما ستعلمه وما الفائدة منه..."></textarea></div><div class="form-row"><div class="form-group"><label class="form-label">الفئة</label><select class="form-input" id="pubCategory"><option value="Technology">💻 التقنية</option><option value="Design">🎨 التصميم</option><option value="Business">📊 الأعمال</option><option value="Language">🌍 اللغات</option></select></div><div class="form-group"><label class="form-label">المستوى</label><select class="form-input" id="pubLevel"><option value="beginner">مبتدئ</option><option value="intermediate">متوسط</option><option value="advanced">متقدم</option></select></div></div><div class="form-row"><div class="form-group"><label class="form-label">مدة الجلسة (دقيقة)</label><input class="form-input" id="pubDuration" type="number" value="60" min="15" max="480" /></div><div class="form-group"><label class="form-label">عدد الجلسات</label><input class="form-input" id="pubSessions" type="number" value="4" min="1" max="20" /></div></div><div class="form-group"><label class="form-label">وسوم (مفصولة بفاصلة)</label><input class="form-input" id="pubTags" placeholder="JavaScript, React, Frontend" /></div><div class="form-group"><label class="form-label">اللغة</label><select class="form-input" id="pubLang"><option value="العربية">العربية</option><option value="English">English</option><option value="كلاهما">كلاهما</option></select></div><button class="saas-btn saas-btn-primary" style="width:100%;padding:14px;margin-top:8px" onclick="submitSkill()" id="submitSkillBtn">🚀 نشر المهارة</button></div> `; document.body.appendChild(overlay); overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); }); }; window.submitSkill = async function() { const title = document.getElementById('pubTitle')?.value?.trim(); const description = document.getElementById('pubDesc')?.value?.trim(); if (!title || !description) return S.toast('العنوان والوصف مطلوبان', 'warning'); const btn = document.getElementById('submitSkillBtn'); btn.disabled = true; btn.textContent = '⏳...'; try { const tagsRaw = document.getElementById('pubTags')?.value || ''; await S.api('/api/marketplace/skills', { method: 'POST', body: JSON.stringify({ title, description, category: document.getElementById('pubCategory')?.value || 'Technology', level: document.getElementById('pubLevel')?.value || 'beginner', duration: parseInt(document.getElementById('pubDuration')?.value) || 60, sessionCount: parseInt(document.getElementById('pubSessions')?.value) || 4, language: document.getElementById('pubLang')?.value || 'العربية', tags: tagsRaw.split(',').map(t => t.trim()).filter(Boolean), }), }); document.querySelector('.modal-overlay')?.remove(); S.toast('تم نشر المهارة بنجاح! 🎉', 'success'); resetAndLoad(); } catch (err) { S.toast('خطأ في النشر', 'error'); } finally { if (btn) { btn.disabled = false; btn.textContent = '🚀 نشر المهارة'; } } }; window.loadMore = function() { loadSkills(); }; loadSkills(); })(); </script></body></html>
