<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة التعلم الذكية | شارك</title>
  <meta name="description" content="أدخل هدفك المهني واحصل على خريطة تعلم مخصصة بالذكاء الاصطناعي." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/saas/saas.css" />
<link rel="stylesheet" href="/tria-theme.css">
  <script src="/config.js"></script>
  <style>
    .roadmap-hero { text-align: center; padding: 32px 20px 24px; }
    .roadmap-hero h1 {
      font-size: clamp(22px, 3.8vw, 34px);
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #b57bee, #8b5cf6, #d3a4ef);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .roadmap-hero p { color: var(--saas-muted); font-size: 14px; max-width: 520px; margin: 0 auto 24px; }

    .goal-input-wrap {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    .goal-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--saas-border);
      background: var(--saas-surface);
      color: var(--saas-text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .goal-input:focus { border-color: #b57bee; box-shadow: var(--saas-glow); }

    .goal-examples {
      max-width: 680px;
      margin: 14px auto 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .goal-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--saas-border);
      background: rgba(181,123,238,0.06);
      color: var(--saas-text);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .goal-chip:hover {
      border-color: #b57bee;
      color: #d3a4ef;
      background: rgba(181,123,238,0.15);
      transform: translateY(-1px);
    }

    .roadmap-container { max-width: 820px; margin: 0 auto; padding: 0 16px 48px; }

    .roadmap-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .meta-card {
      background: var(--saas-surface);
      border: 1px solid var(--saas-border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .meta-card .meta-value { font-size: 22px; font-weight: 800; color: #b57bee; }
    .meta-card .meta-label { font-size: 11px; color: var(--saas-muted); margin-top: 4px; }

    /* Timeline RTL Layout */
    .timeline {
      position: relative;
      padding-inline-start: 48px;
      margin-top: 24px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      inset-inline-start: 16px;
      top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, #b57bee, #8b5cf6, #d3a4ef);
      border-radius: 99px;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 22px;
    }
    .timeline-dot {
      position: absolute;
      inset-inline-start: -48px;
      top: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      border: 2px solid #b57bee;
      background: var(--saas-surface-solid);
      color: #b57bee;
      z-index: 2;
      box-shadow: 0 0 12px rgba(181,123,238,0.3);
      transition: all 0.2s;
    }
    .timeline-dot.completed {
      background: #10b981;
      border-color: #10b981;
      color: white;
      box-shadow: 0 0 12px rgba(16,185,129,0.4);
    }

    .timeline-card {
      background: var(--saas-surface);
      border: 1px solid var(--saas-border);
      border-radius: 16px;
      padding: 18px 20px;
      transition: all 0.2s;
    }
    .timeline-card:hover {
      border-color: rgba(181,123,238,0.4);
      box-shadow: 0 6px 24px rgba(181,123,238,0.15);
    }
    .timeline-card.done {
      border-color: rgba(16,185,129,0.3);
      background: rgba(16,185,129,0.05);
    }

    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .timeline-week { font-size: 12px; color: var(--saas-muted); font-weight: 600; }
    .timeline-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--saas-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .timeline-check.checked { background: #10b981; border-color: #10b981; color: white; }

    .timeline-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--saas-text); }

    .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .skill-tag {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(181,123,238,0.1);
      border: 1px solid rgba(181,123,238,0.2);
      color: #d3a4ef;
      font-size: 12px;
    }

    .resources-section { margin-top: 28px; }
    .resources-section h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
    .resource-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--saas-surface);
      border: 1px solid var(--saas-border);
      border-radius: 12px;
      margin-bottom: 10px;
      text-decoration: none;
      color: var(--saas-text);
      transition: all 0.2s;
    }
    .resource-card:hover { border-color: rgba(181,123,238,0.4); transform: translateX(-3px); }

    .progress-section {
      background: var(--saas-surface);
      border: 1px solid var(--saas-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .prog-ring-wrap { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
    .prog-ring { transform: rotate(-90deg); }
    .prog-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #b57bee; }

    @media (max-width: 768px) {
      .roadmap-meta { grid-template-columns: repeat(2, 1fr); }
      .goal-input-wrap { flex-direction: column; }
      .timeline { padding-inline-start: 40px; }
      .timeline-dot { inset-inline-start: -40px; width: 28px; height: 28px; font-size: 11px; }
    }
  </style>
  <script src="/i18n.js" defer></script><script src="/toast.js" defer></script>
</head>
<body class="dark saas-app">
  <div id="saas-root"></div>
  <script src="/saas/saas-shell.js"></script>
  <script>
    (async function () {
      const S = window.SharikSaaS;
      if (!S.requireAuth()) return;
      const content = S.mountShell("roadmap");
      if (!content) return;

      let currentRoadmap = null;
      let completedMilestones = new Set(JSON.parse(localStorage.getItem('completedMilestones') || '[]'));
      let currentGoal = '';

      function esc(str) { return S.escapeHtml(str); }

      content.innerHTML = `
        <div class="roadmap-hero">
          <h1>🗺️ خريطة التعلم الذكية</h1>
          <p>أخبرنا بهدفك المهني، وسيضع المساعد الذكي خريطة تعلم مخصصة لك خطوة بخطوة</p>
          <div class="goal-input-wrap">
            <input class="goal-input" id="goalInput" type="text" placeholder="مثال: أريد أن أصبح مهندس ذكاء اصطناعي..." />
            <button class="saas-btn saas-btn-primary" id="generateBtn" onclick="window.generateRoadmap()">🚀 توليد الخريطة</button>
          </div>
          <div class="goal-examples">
            <button class="goal-chip" onclick="window.setGoal('أريد أن أصبح مهندس ذكاء اصطناعي')">🤖 AI Engineer</button>
            <button class="goal-chip" onclick="window.setGoal('أريد أن أصبح مطور Frontend')">💻 Frontend Developer</button>
            <button class="goal-chip" onclick="window.setGoal('أريد أن أصبح مطور Backend')">⚙️ Backend Developer</button>
            <button class="goal-chip" onclick="window.setGoal('أريد تعلم تصميم UI/UX')">🎨 UI/UX Designer</button>
            <button class="goal-chip" onclick="window.setGoal('أريد أن أصبح أخصائي أمن معلومات')">🛡️ Cybersecurity</button>
            <button class="goal-chip" onclick="window.setGoal('أريد أن أصبح عالم بيانات')">📊 Data Scientist</button>
          </div>
        </div>
        <div id="roadmapOutput"></div>
      `;

      document.getElementById('goalInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') window.generateRoadmap();
      });

      window.setGoal = function(goal) {
        document.getElementById('goalInput').value = goal;
        window.generateRoadmap();
      };

      window.generateRoadmap = async function() {
        const goal = document.getElementById('goalInput').value.trim();
        if (!goal) { S.toast('أدخل هدفك المهني أولاً', 'warning'); return; }
        currentGoal = goal;
        localStorage.setItem('lastRoadmapGoal', goal);
        completedMilestones.clear();
        localStorage.setItem('completedMilestones', '[]');

        const btn = document.getElementById('generateBtn');
        if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
        document.getElementById('roadmapOutput').innerHTML = `
          <div style="text-align:center;padding:50px 20px">
            <div class="skeleton" style="width:60px;height:60px;border-radius:50%;margin:0 auto 16px"></div>
            <h3>يحلل المساعد الذكي هدفك (${esc(goal)})...</h3>
            <p style="color:var(--saas-muted);font-size:13px">جاري إعداد خطة التعلم المخصصة والأنسب لمستواك</p>
          </div>
        `;
        try {
          const data = await S.api('/api/ai/roadmap', { method: 'POST', body: JSON.stringify({ goal }) });
          currentRoadmap = data.roadmap;
          renderRoadmap();
        } catch (err) {
          document.getElementById('roadmapOutput').innerHTML = '<div style="text-align:center;padding:40px;color:var(--saas-muted)">حدث خطأ في إنشاء الخريطة. حاول مرة أخرى.</div>';
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = '🚀 توليد الخريطة'; }
        }
      };

      function renderRoadmap() {
        const r = currentRoadmap;
        if (!r) return;
        const milestones = r.milestones || [];
        const completed = milestones.filter(function(_, i) { return completedMilestones.has(i); }).length;
        const pct = milestones.length ? Math.round((completed / milestones.length) * 100) : 0;
        const circumference = 2 * Math.PI * 34;
        const offset = circumference - (pct / 100) * circumference;
        const typeIcons = { documentation: '📚', course: '🎓', tutorial: '📖', video: '🎥', tool: '🔧', other: '🔗' };

        const milestonesHtml = milestones.map(function(m, i) {
          const isDone = completedMilestones.has(i);
          const skillTags = (m.skills || []).map(function(s) { return '<span class="skill-tag">' + esc(s) + '</span>'; }).join('');
          return '<div class="timeline-item">' +
            '<div class="timeline-dot ' + (isDone ? 'completed' : '') + '">' + (isDone ? '✓' : (i + 1)) + '</div>' +
            '<div class="timeline-card ' + (isDone ? 'done' : '') + '">' +
            '<div class="timeline-header">' +
            '<span class="timeline-week">الأسبوع ' + (m.week || (i * 2 + 1)) + '</span>' +
            '<div class="timeline-check ' + (isDone ? 'checked' : '') + '" onclick="window.toggleMilestone(' + i + ')" title="تحديد كمكتمل">' + (isDone ? '✓' : '') + '</div>' +
            '</div>' +
            '<div class="timeline-title">' + esc(m.title) + '</div>' +
            '<div class="skill-tags">' + skillTags + '</div>' +
            '</div></div>';
        }).join('');

        const resourcesHtml = (r.resources || []).length > 0 ? '<div class="resources-section"><h3>📚 المصادر والمراجع الموصى بها</h3>' +
          (r.resources || []).map(function(res) {
            return '<a href="' + esc(res.url || '#') + '" target="_blank" rel="noopener" class="resource-card">' +
              '<span style="font-size:22px">' + (typeIcons[res.type] || '🔗') + '</span>' +
              '<div><div style="font-weight:700;font-size:14px">' + esc(res.title) + '</div>' +
              '<div style="font-size:12px;color:var(--saas-muted)">' + esc(res.type || 'مصدر تعليمي') + '</div></div></a>';
          }).join('') + '</div>' : '';

        const mentorHtml = (r.mentorSkills || []).length > 0 ? '<div style="margin-top:24px"><h3 style="font-size:16px;font-weight:700;margin-bottom:12px">🎯 اطلب مرشداً في هذه المهارات:</h3>' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">' +
          (r.mentorSkills || []).map(function(s) { return '<span class="saas-chip">' + esc(s) + '</span>'; }).join('') +
          '</div><a href="/login-signup/matching-results.html" class="saas-btn saas-btn-primary">🤝 البحث عن شريك مطابقة</a></div>' : '';

        document.getElementById('roadmapOutput').innerHTML = `
          <div class="roadmap-container">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
              <div>
                <h2 style="font-size:22px;font-weight:800;margin:0">${esc(r.title || 'خريطة التعلم المخصصة')}</h2>
                <p style="color:var(--saas-muted);font-size:13px;margin:4px 0 0">الهدف الحالي: <strong>${esc(currentGoal)}</strong></p>
              </div>
              <button class="saas-btn saas-btn-ghost" onclick="window.resetRoadmap()">🔄 اختيار هدف آخر</button>
            </div>

            <div class="progress-section">
              <div class="prog-ring-wrap">
                <svg class="prog-ring" width="76" height="76" viewBox="0 0 80 80">
                  <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(181,123,238,0.15)" stroke-width="8"/>
                  <circle cx="40" cy="40" r="34" fill="none" stroke="#b57bee" stroke-width="8" stroke-linecap="round"
                    stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 0.8s ease"/>
                </svg>
                <div class="prog-text">${pct}%</div>
              </div>
              <div style="flex:1">
                <h4 style="font-size:16px;font-weight:700;margin:0 0 4px">تقدمك في خريطة التعلم</h4>
                <p style="color:var(--saas-muted);font-size:13px;margin:0">أكملت ${completed} من إجمالي ${milestones.length} مراحل مخصصة</p>
                ${r.note ? '<p style="color:#f59e0b;font-size:12px;margin-top:6px">💡 ' + esc(r.note) + '</p>' : ''}
              </div>
            </div>

            <div class="roadmap-meta">
              <div class="meta-card"><div class="meta-value">${r.estimatedWeeks || 16}</div><div class="meta-label">أسبوع تقريبي</div></div>
              <div class="meta-card"><div class="meta-value">${milestones.length}</div><div class="meta-label">مرحلة رئيسية</div></div>
              <div class="meta-card"><div class="meta-value">${(r.resources || []).length}</div><div class="meta-label">مراجعة ومصدر</div></div>
              <div class="meta-card"><div class="meta-value" style="color:#10b981">${completed}</div><div class="meta-label">مكتمـل</div></div>
            </div>

            <div class="timeline">${milestonesHtml}</div>
            ${resourcesHtml}
            ${mentorHtml}
          </div>
        `;
      }

      window.toggleMilestone = function(i) {
        if (completedMilestones.has(i)) {
          completedMilestones.delete(i);
        } else {
          completedMilestones.add(i);
        }
        localStorage.setItem('completedMilestones', JSON.stringify([...completedMilestones]));
        renderRoadmap();
      };

      window.resetRoadmap = function() {
        currentRoadmap = null;
        document.getElementById('roadmapOutput').innerHTML = '';
        document.getElementById('goalInput').value = '';
        document.getElementById('goalInput').focus();
      };

      const savedGoal = localStorage.getItem('lastRoadmapGoal');
      if (savedGoal) {
        document.getElementById('goalInput').value = savedGoal;
      }
    })();
  </script>
</body>
</html>
