name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-js كامل
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-js كامل/package-lock.json
      - run: npm ci
      - run: node -e "require('./modules/skillQuestionBank'); require('./modules/skillTestService'); require('./modules/gamification'); console.log('modules ok')"
