<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>المجتمع التعليمي | شارك</title><meta name="description" content="تفاعل مع مجتمع شارك، شارك إنجازاتك، اسأل أسئلتك، وتعلم من الآخرين." /><meta name="robots" content="noindex, follow" /><link rel="icon" href="/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="/saas/saas.css" />
<link rel="stylesheet" href="/tria-theme.css"><script src="/config.js"></script><style> .feed-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 24px; max-width: 1100px; margin: 0 auto; } .feed-main {} .feed-sidebar { display: flex; flex-direction: column; gap: 16px; } /* Composer */ .composer { background: var(--saas-surface); border: 1px solid var(--saas-border); border-radius: 16px; padding: 16px; margin-bottom: 20px; } .composer-top { display: flex; gap: 12px; align-items: flex-start; } .user-ava { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #b57bee, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; overflow: hidden; } .user-ava img { width: 100%; height: 100%; object-fit: cover; } .composer-textarea { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--saas-border); border-radius: 10px; padding: 12px; color: var(--saas-text); font-family: inherit; font-size: 14px; resize: none; min-height: 80px; outline: none; transition: border-color 0.2s; } .composer-textarea:focus { border-color: #b57bee; } .composer-footer { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; } .type-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--saas-border); background: transparent; color: var(--saas-muted); cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.2s; } .type-btn:hover, .type-btn.active { background: rgba(181,123,238,0.1); border-color: rgba(181,123,238,0.3); color: #d3a4ef; } .publish-btn { margin-right: auto; } /* Filter tabs */ .feed-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; } .feed-tab { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--saas-border); background: transparent; color: var(--saas-muted); cursor: pointer; font-size: 13px; font-family: inherit; transition: all 0.2s; } .feed-tab:hover { border-color: rgba(181,123,238,0.4); color: #d3a4ef; } .feed-tab.active { background: rgba(181,123,238,0.15); border-color: rgba(181,123,238,0.4); color: #d3a4ef; } /* Post Card */ .post-card { background: var(--saas-surface); border: 1px solid var(--saas-border); border-radius: 16px; padding: 18px; margin-bottom: 14px; animation: fadeUp 0.3s ease both; transition: border-color 0.2s; } .post-card:hover { border-color: rgba(255,255,255,0.15); } @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} } .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; } .post-ava { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #b57bee, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; flex-shrink: 0; } .post-ava img { width: 100%; height: 100%; object-fit: cover; } .post-author { font-weight: 700; font-size: 14px; } .post-meta { font-size: 12px; color: var(--saas-muted); margin-top: 2px; } .post-type-badge { margin-right: auto; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; } .badge-achievement { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); } .badge-question { background: rgba(181,123,238,0.15); color: #d3a4ef; border: 1px solid rgba(181,123,238,0.3); } .badge-resource { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); } .badge-milestone { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); } .badge-project { background: rgba(211,164,239,0.15); color: #d3a4ef; border: 1px solid rgba(211,164,239,0.3); } .badge-general { background: rgba(168,155,194,0.15); color: #94a3b8; border: 1px solid rgba(168,155,194,0.3); } .post-content { font-size: 14px; line-height: 1.8; margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; } .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; } .post-tag { padding: 3px 10px; border-radius: 20px; background: rgba(181,123,238,0.1); border: 1px solid rgba(181,123,238,0.2); color: #d3a4ef; font-size: 12px; } .post-actions { display: flex; gap: 16px; border-top: 1px solid var(--saas-border); padding-top: 12px; } .action-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--saas-muted); cursor: pointer; font-size: 13px; font-family: inherit; padding: 6px 10px; border-radius: 8px; transition: all 0.2s; } .action-btn:hover { background: rgba(181,123,238,0.1); color: #d3a4ef; } .action-btn.liked { color: #ef4444; } .action-btn.liked:hover { background: rgba(239,68,68,0.1); } /* Comments */ .comments-section { margin-top: 14px; border-top: 1px solid var(--saas-border); padding-top: 14px; display: none; } .comments-section.open { display: block; } .comment { display: flex; gap: 10px; margin-bottom: 10px; } .comment-ava { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #8b4fd6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; } .comment-bubble { flex: 1; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 8px 12px; font-size: 13px; } .comment-name { font-weight: 700; font-size: 12px; margin-bottom: 3px; } .comment-input-wrap { display: flex; gap: 8px; margin-top: 10px; } .comment-input { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--saas-border); border-radius: 8px; padding: 8px 12px; color: var(--saas-text); font-family: inherit; font-size: 13px; outline: none; } .comment-input:focus { border-color: #b57bee; } /* Sidebar widgets */ .sidebar-widget { background: var(--saas-surface); border: 1px solid var(--saas-border); border-radius: 14px; padding: 16px; } .widget-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; } .trending-tag { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--saas-border); font-size: 13px; } .trending-tag:last-child { border-bottom: none; } .trending-count { color: var(--saas-muted); font-size: 12px; } .active-user { display: flex; align-items: center; gap: 10px; padding: 8px 0; } .active-user-ava { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #b57bee, #8b4fd6); display: flex; align-items: center; justify-content: center; font-size: 14px; } .active-user-name { font-size: 13px; font-weight: 600; } .active-user-skill { font-size: 11px; color: var(--saas-muted); } .skeleton-post { background: var(--saas-surface); border: 1px solid var(--saas-border); border-radius: 16px; padding: 18px; margin-bottom: 14px; } .empty-feed { text-align: center; padding: 48px 24px; color: var(--saas-muted); } .empty-feed .icon { font-size: 48px; margin-bottom: 12px; } @media (max-width: 768px) { .feed-layout { grid-template-columns: 1fr; padding: 12px; } .feed-sidebar { display: none; } } </style>  <script src="/i18n.js" defer></script><script src="/toast.js" defer></script>
</head><body class="dark saas-app"><div id="saas-root"></div><script src="/saas/saas-shell.js"></script><script> (async function () { const S = window.SharikSaaS; if (!S.requireAuth()) return; const content = S.mountShell("feed"); if (!content) return; const user = S.getUser(); let page = 1; let currentFilter = 'all'; let loading = false; let hasMore = true; let selectedType = 'general'; function escapeHtml(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } function timeAgo(dateStr) { const diff = Date.now() - new Date(dateStr); const m = Math.floor(diff / 60000); if (m < 1) return 'الآن'; if (m < 60) return `منذ ${m} دقيقة`; const h = Math.floor(m / 60); if (h < 24) return `منذ ${h} ساعة`; const d = Math.floor(h / 24); return `منذ ${d} يوم`; } const typeLabels = { achievement: '🏆 إنجاز', question: '❓ سؤال', resource: '📚 مصدر', milestone: '🎯 هدف', project: '🚀 مشروع', general: '💬 عام' }; const typeBadge = { achievement: 'badge-achievement', question: 'badge-question', resource: 'badge-resource', milestone: 'badge-milestone', project: 'badge-project', general: 'badge-general' }; content.innerHTML = ` <div style="padding:0 0 12px;max-width:1100px;margin:0 auto;padding:0 24px"><div class="saas-page-head"><div><h1>المجتمع التعليمي</h1><p>شارك إنجازاتك، اسأل أسئلتك، وتفاعل مع مجتمع شارك</p></div></div></div><div class="feed-layout"><div class="feed-main"><div class="composer"><div class="composer-top"><div class="user-ava">${user.avatar ? `<img loading="lazy" decoding="async" src="${escapeHtml(user.avatar)}" alt="">` : '👤'}</div><textarea class="composer-textarea" id="postContent" placeholder="شارك شيئاً مع المجتمع... إنجاز، سؤال، أو مصدر مفيد"></textarea></div><div class="composer-footer"><button class="type-btn active" data-type="general" onclick="setType('general',this)">💬 عام</button><button class="type-btn" data-type="achievement" onclick="setType('achievement',this)">🏆 إنجاز</button><button class="type-btn" data-type="question" onclick="setType('question',this)">❓ سؤال</button><button class="type-btn" data-type="resource" onclick="setType('resource',this)">📚 مصدر</button><button class="type-btn" data-type="project" onclick="setType('project',this)">🚀 مشروع</button><button class="saas-btn saas-btn-primary publish-btn" onclick="publishPost()" id="publishBtn">نشر</button></div></div><div class="feed-tabs"><button class="feed-tab active" onclick="filterPosts('all',this)">الكل</button><button class="feed-tab" onclick="filterPosts('achievement',this)">🏆 الإنجازات</button><button class="feed-tab" onclick="filterPosts('question',this)">❓ الأسئلة</button><button class="feed-tab" onclick="filterPosts('resource',this)">📚 المصادر</button><button class="feed-tab" onclick="filterPosts('project',this)">🚀 المشاريع</button></div><div id="postsContainer"> ${[1,2,3].map(() => ` <div class="skeleton-post"><div class="skeleton" style="height:14px;width:200px;margin-bottom:12px"></div><div class="skeleton" style="height:60px;margin-bottom:12px"></div><div class="skeleton" style="height:14px;width:300px"></div></div> `).join('')} </div><div id="loadMoreWrap" style="text-align:center;padding:16px;display:none"><button class="saas-btn saas-btn-ghost" onclick="loadMore()">تحميل المزيد</button></div></div><div class="feed-sidebar"><div class="sidebar-widget"><div class="widget-title">🔥 المواضيع الرائجة</div> ${['JavaScript', 'React', 'UI/UX', 'Python', 'Node.js', 'Docker'].map((t, i) => ` <div class="trending-tag"><span>#${t}</span><span class="trending-count">${Math.floor(50 - i * 7)} منشور</span></div> `).join('')} </div><div class="sidebar-widget"><div class="widget-title">⚡ قصص سريعة للنشر</div><div style="display:flex;flex-direction:column;gap:8px"><button class="type-btn" style="width:100%;justify-content:flex-start" onclick="quickPost('🎯 أكملت درساً جديداً في')">🎯 أكملت درساً</button><button class="type-btn" style="width:100%;justify-content:flex-start" onclick="quickPost('❓ سؤال تقني: ')">❓ اسأل سؤالاً</button><button class="type-btn" style="width:100%;justify-content:flex-start" onclick="quickPost('📚 مصدر رائع: ')">📚 شارك مصدراً</button><button class="type-btn" style="width:100%;justify-content:flex-start" onclick="quickPost('🚀 أطلقت مشروعي الجديد: ')">🚀 اعرض مشروعاً</button></div></div><div class="sidebar-widget"><div class="widget-title">👥 أعضاء نشطون</div> ${[ { n: 'أحمد محمد', s: 'React Developer' }, { n: 'سارة أحمد', s: 'UI/UX Designer' }, { n: 'محمد علي', s: 'Backend Dev' }, ].map(u => ` <div class="active-user"><div class="active-user-ava">👤</div><div><div class="active-user-name">${u.n}</div><div class="active-user-skill">${u.s}</div></div><div style="width:8px;height:8px;border-radius:50%;background:#10b981;margin-right:auto;box-shadow:0 0 6px #10b981"></div></div> `).join('')} </div></div></div> `; window.setType = function(type, btn) { selectedType = type; document.querySelectorAll('.type-btn[data-type]').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }; window.filterPosts = function(filter, btn) { currentFilter = filter; page = 1; hasMore = true; document.querySelectorAll('.feed-tab').forEach(b => b.classList.remove('active')); btn.classList.add('active'); document.getElementById('postsContainer').innerHTML = ''; loadPosts(); }; window.quickPost = function(prefix) { document.getElementById('postContent').value = prefix; document.getElementById('postContent').focus(); document.getElementById('postContent').scrollIntoView({ behavior: 'smooth' }); }; async function loadPosts() { if (loading || !hasMore) return; loading = true; try { const params = new URLSearchParams({ page, limit: 10 }); if (currentFilter !== 'all') params.set('type', currentFilter); const data = await S.api(`/api/feed?${params}`); hasMore = data.hasMore; page++; const container = document.getElementById('postsContainer'); if (data.posts.length === 0 && page === 2) { container.innerHTML = ` <div class="empty-feed"><div class="icon">💬</div><h3>لا توجد منشورات بعد</h3><p>كن أول من يشارك في المجتمع!</p></div> `; } else { data.posts.forEach(p => container.insertAdjacentHTML('beforeend', renderPost(p))); } document.getElementById('loadMoreWrap').style.display = hasMore ? 'block' : 'none'; } catch (err) { document.getElementById('postsContainer').innerHTML = '<div style="text-align:center;padding:40px;color:var(--saas-muted)">تعذّر تحميل المنشورات.</div>'; } finally { loading = false; } } function renderPost(p) { const myEmail = user.email || ''; const liked = (p.likes || []).includes(myEmail); return ` <div class="post-card" id="post-${p._id}"><div class="post-header"><div class="post-ava">${p.authorAvatar ? `<img loading="lazy" decoding="async" src="${escapeHtml(p.authorAvatar)}" alt="">` : '👤'}</div><div><div class="post-author">${escapeHtml(p.authorName || 'مستخدم')}</div><div class="post-meta">${escapeHtml(p.authorLevel || '')} • ${timeAgo(p.createdAt)}</div></div><span class="post-type-badge ${typeBadge[p.type] || 'badge-general'}">${typeLabels[p.type] || '💬 عام'}</span></div><div class="post-content">${escapeHtml(p.content)}</div> ${(p.tags || []).length > 0 ? `<div class="post-tags">${p.tags.map(t => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''} <div class="post-actions"><button class="action-btn ${liked ? 'liked' : ''}" onclick="likePost('${p._id}', this)"> ${liked ? '❤️' : '🤍'} <span class="likes-count">${p.likes?.length || 0}</span></button><button class="action-btn" onclick="toggleComments('${p._id}')"> 💬 <span>${(p.comments || []).length}</span></button> ${p.authorEmail === myEmail ? `<button class="action-btn" style="margin-right:auto;color:#ef4444" onclick="deletePost('${p._id}')">🗑️</button>` : ''} </div><div class="comments-section" id="comments-${p._id}"> ${(p.comments || []).slice(0, 5).map(c => ` <div class="comment"><div class="comment-ava">👤</div><div class="comment-bubble"><div class="comment-name">${escapeHtml(c.authorName || 'مستخدم')}</div> ${escapeHtml(c.content)} </div></div> `).join('')} <div class="comment-input-wrap"><input class="comment-input" id="commentInput-${p._id}" placeholder="أضف تعليقاً..." onkeydown="if(event.key==='Enter')addComment('${p._id}')" /><button class="saas-btn saas-btn-primary" style="padding:8px 14px;font-size:13px" onclick="addComment('${p._id}')">إرسال</button></div></div></div> `; } window.likePost = async function(id, btn) { try { const data = await S.api(`/api/feed/post/${id}/like`, { method: 'POST' }); btn.classList.toggle('liked', data.liked); btn.innerHTML = `${data.liked ? '❤️' : '🤍'} <span class="likes-count">${data.likesCount}</span>`; } catch (err) { S.toast('خطأ في الإعجاب', 'error'); } }; window.toggleComments = function(id) { const sec = document.getElementById(`comments-${id}`); sec.classList.toggle('open'); }; window.addComment = async function(id) { const input = document.getElementById(`commentInput-${id}`); const content = input.value.trim(); if (!content) return; try { const data = await S.api(`/api/feed/post/${id}/comment`, { method: 'POST', body: JSON.stringify({ content }) }); const c = data.comment; const sec = document.getElementById(`comments-${id}`); const div = document.createElement('div'); div.className = 'comment'; div.innerHTML = `<div class="comment-ava">👤</div><div class="comment-bubble"><div class="comment-name">${escapeHtml(c.authorName)}</div>${escapeHtml(c.content)}</div>`; sec.insertBefore(div, sec.querySelector('.comment-input-wrap')); input.value = ''; } catch (err) { S.toast('خطأ في التعليق', 'error'); } }; window.deletePost = async function(id) { if (!(await SharikConfirm.show('حذف المنشور؟'))) return; try { await S.api(`/api/feed/post/${id}`, { method: 'DELETE' }); document.getElementById(`post-${id}`)?.remove(); S.toast('تم حذف المنشور', 'success'); } catch (err) { S.toast('خطأ في الحذف', 'error'); } }; window.publishPost = async function() { const content = document.getElementById('postContent').value.trim(); if (!content) return S.toast('اكتب محتوى أولاً', 'warning'); const btn = document.getElementById('publishBtn'); btn.disabled = true; btn.textContent = '⏳...'; try { const data = await S.api('/api/feed/post', { method: 'POST', body: JSON.stringify({ content, type: selectedType }), }); document.getElementById('postsContainer').insertAdjacentHTML('afterbegin', renderPost(data.post)); document.getElementById('postContent').value = ''; S.toast('تم نشر المنشور! 🎉', 'success'); } catch (err) { S.toast('خطأ في النشر', 'error'); } finally { btn.disabled = false; btn.textContent = 'نشر'; } }; window.loadMore = function() { loadPosts(); }; /* Initial load */ loadPosts(); /* Infinite scroll */ window.addEventListener('scroll', () => { if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) { loadPosts(); } }); })(); </script></body></html>
