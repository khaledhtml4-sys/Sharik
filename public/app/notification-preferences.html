<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>إعدادات الإشعارات | شارك</title><meta name="robots" content="noindex, follow" /><link rel="icon" href="/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="/saas/saas.css" />
<link rel="stylesheet" href="/tria-theme.css"><script src="/config.js"></script><style> .pref-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 600px; margin: 0 auto 20px; } .pref-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); } .pref-item:last-child { border-bottom: none; } .pref-label { font-weight: 600; font-size: 14px; } .pref-desc { font-size: 12px; color: var(--muted); margin-top: 2px; } .toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; } .toggle-switch input { opacity: 0; width: 0; height: 0; } .slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; cursor: pointer; transition: 0.3s; } .slider::before { content: ''; position: absolute; height: 18px; width: 18px; right: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; } input:checked + .slider { background: #b57bee; } input:checked + .slider::before { transform: translateX(-20px); } </style>  <script src="/i18n.js" defer></script><script src="/toast.js" defer></script>
</head><body class="dark saas-app"><div id="saas-root"></div><script src="/saas/saas-shell.js"></script><script> (async function () { const S = window.SharikSaaS; if (!S.requireAuth()) return; const content = S.mountShell("notifications"); if (!content) return; content.innerHTML = ` <div class="saas-page-head"><div><h1>⚙️ إعدادات الإشعارات</h1><p>خصص ما يصلك من إشعارات وتحديثات المنصة</p></div></div><div class="pref-card"><div class="pref-item"><div><div class="pref-label">🔔 إشعارات المطابقة</div><div class="pref-desc">عند العثور على شريك جديد أو قبول طلب مطابقة</div></div><label class="toggle-switch"><input type="checkbox" id="prefMatches" checked /><span class="slider"></span></label></div><div class="pref-item"><div><div class="pref-label">📅 إشعارات الجلسات</div><div class="pref-desc">تذكيرات قبل موعد الجلسات وتحديثات جدول المواعيد</div></div><label class="toggle-switch"><input type="checkbox" id="prefSessions" checked /><span class="slider"></span></label></div><div class="pref-item"><div><div class="pref-label">💬 المجتمع والتفاعلات</div><div class="pref-desc">عند التعليق أو الإعجاب بمنشوراتك في المجتمع</div></div><label class="toggle-switch"><input type="checkbox" id="prefCommunity" checked /><span class="slider"></span></label></div><div class="pref-item"><div><div class="pref-label">🏆 التحديات والإنجازات</div><div class="pref-desc">عند توفر تحدٍّ جديد أو فتح شارة جديدة</div></div><label class="toggle-switch"><input type="checkbox" id="prefChallenges" checked /><span class="slider"></span></label></div><div class="pref-item"><div><div class="pref-label">🤖 التوصيات الذكية</div><div class="pref-desc">توصيات المساعد الذكي للمهارات والخبراء المناسبين</div></div><label class="toggle-switch"><input type="checkbox" id="prefAiUpdates" checked /><span class="slider"></span></label></div><div style="margin-top:24px"><button class="saas-btn saas-btn-primary" style="width:100%;padding:14px" onclick="savePreferences()" id="saveBtn">💾 حفظ الإعدادات</button></div></div> `; try { const data = await S.api('/api/notification-preferences'); const p = data.preferences || {}; if (p.matches !== undefined) document.getElementById('prefMatches').checked = p.matches; if (p.sessions !== undefined) document.getElementById('prefSessions').checked = p.sessions; if (p.community !== undefined) document.getElementById('prefCommunity').checked = p.community; if (p.challenges !== undefined) document.getElementById('prefChallenges').checked = p.challenges; if (p.aiUpdates !== undefined) document.getElementById('prefAiUpdates').checked = p.aiUpdates; } catch (err) {} window.savePreferences = async function() { const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = '⏳...'; try { await S.api('/api/notification-preferences', { method: 'PUT', body: JSON.stringify({ preferences: { matches: document.getElementById('prefMatches').checked, sessions: document.getElementById('prefSessions').checked, community: document.getElementById('prefCommunity').checked, challenges: document.getElementById('prefChallenges').checked, aiUpdates: document.getElementById('prefAiUpdates').checked, }, }), }); S.toast('تم حفظ الإعدادات بنجاح! ✅', 'success'); } catch (err) { S.toast('خطأ في حفظ الإعدادات', 'error'); } finally { btn.disabled = false; btn.textContent = '💾 حفظ الإعدادات'; } }; })(); </script></body></html>
