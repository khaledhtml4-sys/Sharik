<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الإشعارات | شارك</title>
  <meta name="description" content="مركز الإشعارات والتنبيهات الخاصة بحسابك في منصة شارك." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/saas/saas.css" />
<link rel="stylesheet" href="/tria-theme.css">
  <script src="/config.js"></script>
  <script src="/i18n.js" defer></script><script src="/toast.js" defer></script>
</head>
<body class="dark saas-app">
  <div id="saas-root"></div>
  <script src="/saas/saas-shell.js"></script>
  <script>
    (async function () {
      const S = window.SharikSaaS;
      if (!S.requireAuth()) return;
      const content = S.mountShell("notifications");
      if (!content) return;

      content.innerHTML = `
        <div class="saas-page-head">
          <div>
            <h1>🔔 مركز الإشعارات</h1>
            <p>جميع التنبيهات، طلُبات المطابقة، وتحديثات الجلسات</p>
          </div>
          <button class="saas-btn saas-btn-ghost" id="markReadBtn">تحديد الكل كُمقروء</button>
        </div>
        <div class="saas-card" id="notifList">
          <div style="text-align:center;padding:40px;color:var(--saas-muted)">جاري التحميل...</div>
        </div>
      `;

      async function loadNotifications() {
        const listEl = document.getElementById('notifList');
        try {
          const data = await S.api('/api/notifications');
          const notifs = data.notifications || [];
          if (!notifs.length) {
            listEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--saas-muted)"><div style="font-size:40px;margin-bottom:12px">🔔</div><p>لا توجد إشعارات حالياً</p></div>';
            return;
          }

          listEl.innerHTML = notifs.map(n => `
            <div style="display:flex;align-items:start;gap:14px;padding:16px 0;border-bottom:1px solid var(--saas-border);${!n.read ? 'background:rgba(181,123,238,0.03);margin:0 -20px;padding:16px 20px;' : ''}">
              <div style="font-size:22px;margin-top:2px">${n.type === 'success' ? '✅' : n.type === 'warning' ? '⚠️' : n.type === 'error' ? '❌' : '💬'}</div>
              <div style="flex:1">
                <div style="font-weight:700;font-size:14px;margin-bottom:4px">${S.escapeHtml(n.title || n.message)}</div>
                ${n.title ? `<div style="font-size:13px;color:var(--saas-muted);margin-bottom:6px">${S.escapeHtml(n.message)}</div>` : ''}
                <div style="font-size:11px;color:var(--saas-muted)">${new Date(n.date || Date.now()).toLocaleString('ar-EG')}</div>
              </div>
              ${!n.read ? '<span class="saas-badge-dot"></span>' : ''}
            </div>
          `).join('');
        } catch (err) {
          listEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--saas-muted)">تعذّر تحميل الإشعارات.</div>';
        }
      }

      document.getElementById('markReadBtn')?.addEventListener('click', async () => {
        try {
          await S.api('/api/notifications/read', { method: 'PATCH' });
          S.toast('تم تحديد جميع الإشعارات كمقروءة', 'success');
          loadNotifications();
        } catch (err) {
          S.toast('خطأ في العملية', 'error');
        }
      });

      loadNotifications();
    })();
  </script>
</body>
</html>
