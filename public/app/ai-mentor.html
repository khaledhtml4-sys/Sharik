<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المساعد الذكي | شارك</title>
  <meta name="description" content="استخدم المساعد الذكي في شارك للحصول على إجابات تقنية، مراجعة الكود، وتوليد اختبارات تفاعلية." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/saas/saas.css" />
<link rel="stylesheet" href="/tria-theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" media="print" onload="this.media='all'" />
  <script src="/config.js"></script>
  <style>
    .ai-layout{display:grid;grid-template-columns:260px 1fr;gap:0;height:calc(100vh - 64px);overflow:hidden}
    .ai-sidebar{background:var(--saas-surface));border-left:1px solid var(--saas-border));padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
    .ai-sidebar-title{font-size:12px;font-weight:700;color:var(--saas-muted);text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px}
    .ai-mode-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--saas-text);cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s;width:100%;text-align:right}
    .ai-mode-btn:hover{background:rgba(181,123,238,.1);border-color:rgba(181,123,238,.2)}
    .ai-mode-btn.active{background:linear-gradient(135deg,rgba(181,123,238,.2),rgba(139,92,246,.2));border-color:rgba(181,123,238,.4);color:#b57bee}
    .ai-mode-icon{font-size:18px;width:28px;text-align:center}
    .ai-main{display:flex;flex-direction:column;height:100%}
    .ai-header{padding:16px 24px;border-bottom:1px solid var(--saas-border));display:flex;align-items:center;gap:12px;background:var(--glass-bg,rgba(13,9,22,.7));backdrop-filter:blur(12px)}
    .ai-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#b57bee,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 0 20px rgba(181,123,238,.4)}
    .ai-header-info h2{font-size:16px;font-weight:700;margin:0}
    .ai-header-info p{font-size:12px;color:var(--saas-muted);margin:0}
    .ai-status{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .ai-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
    .msg{display:flex;gap:12px;animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .msg.user{flex-direction:row-reverse}
    .msg-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .msg.ai .msg-avatar{background:linear-gradient(135deg,#b57bee,#8b5cf6)}
    .msg.user .msg-avatar{background:linear-gradient(135deg,#10b981,#d3a4ef)}
    .msg-bubble{max-width:75%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.7}
    .msg.ai .msg-bubble{background:var(--saas-surface));border:1px solid var(--saas-border);border-radius:4px 16px 16px 16px}
    .msg.user .msg-bubble{background:linear-gradient(135deg,#b57bee,#8b4fd6);color:white;border-radius:16px 4px 16px 16px}
    .msg-bubble pre{background:rgba(0,0,0,.3);border-radius:8px;padding:12px;overflow-x:auto;font-size:13px;margin:8px 0}
    .msg-bubble code{font-family:'Fira Code',monospace;font-size:13px}
    .typing-indicator{display:flex;gap:4px;align-items:center;padding:12px 16px;background:var(--saas-surface);border-radius:4px 16px 16px 16px;width:fit-content}
    .typing-dot{width:8px;height:8px;border-radius:50%;background:#b57bee;animation:bounce 1.2s infinite}
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
    .ai-quick-actions{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--saas-border)}
    .quick-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--saas-border);background:transparent;color:var(--saas-text);cursor:pointer;font-size:13px;font-family:inherit;transition:all .2s;white-space:nowrap}
    .quick-btn:hover{background:rgba(181,123,238,.15);border-color:rgba(181,123,238,.4);color:#d3a4ef}
    .ai-input-area{padding:16px 24px;border-top:1px solid var(--saas-border);display:flex;gap:10px;align-items:flex-end;background:var(--glass-bg)}
    .ai-input{flex:1;background:var(--saas-surface);border:1px solid var(--saas-border);border-radius:12px;padding:12px 16px;color:var(--saas-text);font-family:inherit;font-size:14px;resize:none;min-height:48px;max-height:120px;outline:none;transition:border-color .2s}
    .ai-input:focus{border-color:#b57bee}
    .ai-send-btn{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#b57bee,#8b4fd6);border:none;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
    .ai-send-btn:hover{transform:scale(1.05);box-shadow:0 4px 16px rgba(181,123,238,.4)}
    .ai-send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .code-panel{display:none;flex-direction:column;height:100%}
    .code-panel.active{display:flex}
    .code-input-area{flex:1;padding:16px 24px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
    .code-textarea{width:100%;flex:1;min-height:200px;background:#171026;border:1px solid var(--saas-border);border-radius:12px;color:#e6edf3;font-family:'Fira Code','Courier New',monospace;font-size:14px;padding:16px;resize:vertical;outline:none}
    .code-textarea:focus{border-color:#b57bee}
    .lang-select{padding:8px 12px;border-radius:8px;border:1px solid var(--saas-border);background:var(--saas-surface);color:var(--saas-text);font-family:inherit}
    .review-result{background:var(--saas-surface);border:1px solid var(--saas-border);border-radius:12px;padding:16px}
    .score-ring{display:flex;align-items:center;gap:16px;margin-bottom:16px}
    .score-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;border:3px solid #10b981}
    .suggestion{display:flex;gap:8px;padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:14px}
    .suggestion.warning{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3)}
    .suggestion.info{background:rgba(181,123,238,.1);border:1px solid rgba(181,123,238,.2)}
    .suggestion.success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3)}
    .quiz-panel{display:none;flex-direction:column;height:100%}
    .quiz-panel.active{display:flex}
    .quiz-content{flex:1;overflow-y:auto;padding:24px}
    .quiz-q{background:var(--saas-surface);border:1px solid var(--saas-border);border-radius:12px;padding:20px;margin-bottom:16px}
    .quiz-q-text{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.6}
    .quiz-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--saas-border);margin-bottom:8px;cursor:pointer;transition:all .2s;font-size:14px}
    .quiz-option:hover{border-color:rgba(181,123,238,.5);background:rgba(181,123,238,.05)}
    .quiz-option.selected{border-color:#b57bee;background:rgba(181,123,238,.1)}
    .quiz-option.correct{border-color:#10b981;background:rgba(16,185,129,.1)}
    .quiz-option.wrong{border-color:#ef4444;background:rgba(239,68,68,.1)}
    .quiz-option-letter{width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
    .welcome-msg{text-align:center;padding:40px 20px}
    .welcome-msg .big-icon{font-size:64px;margin-bottom:16px}
    .welcome-msg h2{font-size:24px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#b57bee,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .welcome-msg p{color:var(--saas-muted);font-size:15px;max-width:400px;margin:0 auto}
    @media(max-width:768px){.ai-layout{grid-template-columns:1fr}.ai-sidebar{display:none}}
  </style>
  <script src="/i18n.js" defer></script><script src="/toast.js" defer></script>
</head>
<body class="dark saas-app">
  <div id="saas-root"></div>
  <script src="/saas/saas-shell.js"></script>
  <script>
    (async function () {
      const S = window.SharikSaaS;
      if (!S.requireAuth()) return;
      const content = S.mountShell("ai-mentor");
      if (!content) return;
      const user = S.getUser();
      let currentMode = "chat";
      let chatHistory = [];
      let quizData = null;
      let quizAnswers = {};

      function escapeHtml(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      content.innerHTML = `
        <div class="ai-layout">
          <div class="ai-sidebar">
            <div class="ai-sidebar-title">أوضاع المساعد</div>
            <button class="ai-mode-btn active" data-mode="chat">
              <span class="ai-mode-icon">💬</span><span>محادثة تعليمية</span>
            </button>
            <button class="ai-mode-btn" data-mode="review">
              <span class="ai-mode-icon">🔍</span><span>مراجعة الكود</span>
            </button>
            <button class="ai-mode-btn" data-mode="quiz">
              <span class="ai-mode-icon">🧪</span><span>اختبار تفاعلي</span>
            </button>
            <button class="ai-mode-btn" data-mode="career">
              <span class="ai-mode-icon">🎯</span><span>التوجيه المهني</span>
            </button>
            <div class="ai-sidebar-title" style="margin-top:16px">اقتراحات سريعة</div>
            <button class="ai-mode-btn" onclick="window.quickPrompt('ما هو الفرق بين REST و GraphQL؟')">
              <span class="ai-mode-icon">🌐</span><span>REST vs GraphQL</span>
            </button>
            <button class="ai-mode-btn" onclick="window.quickPrompt('اشرح لي مفهوم Closure في JavaScript')">
              <span class="ai-mode-icon">🔗</span><span>Closures</span>
            </button>
            <button class="ai-mode-btn" onclick="window.quickPrompt('ما أفضل ممارسات CSS؟')">
              <span class="ai-mode-icon">🎨</span><span>CSS Best Practices</span>
            </button>
            <button class="ai-mode-btn" style="margin-top:auto;color:#ef4444" onclick="window.clearChat()">
              <span class="ai-mode-icon">🗑️</span><span>مسح المحادثة</span>
            </button>
          </div>

          <div class="ai-main">
            <div id="chatPanel" style="display:flex;flex-direction:column;height:100%">
              <div class="ai-header">
                <div class="ai-avatar">🤖</div>
                <div class="ai-header-info">
                  <h2>المساعد الذكي — شارك</h2>
                  <p>مدعوم بالذكاء الاصطناعي • يجيب على أسئلتك التقنية</p>
                </div>
                <div class="ai-status" style="margin-right:auto" title="متصل"></div>
              </div>
              <div class="ai-messages" id="messagesContainer">
                <div class="welcome-msg">
                  <div class="big-icon">🤖</div>
                  <h2>مرحباً ${escapeHtml(user.username1 || 'بك')}!</h2>
                  <p>أنا مساعدك الذكي في شارك. يمكنني الإجابة على أسئلتك التقنية، شرح المفاهيم، مراجعة الكود، وتوليد اختبارات تفاعلية.</p>
                </div>
              </div>
              <div class="ai-quick-actions">
                <button class="quick-btn" onclick="window.quickPrompt('اشرح async/await')">⚡ async/await</button>
                <button class="quick-btn" onclick="window.quickPrompt('ما هو Docker؟')">🐳 Docker</button>
                <button class="quick-btn" onclick="window.quickPrompt('أفضل مصادر تعلم React')">📚 React Resources</button>
                <button class="quick-btn" onclick="window.quickPrompt('كيف أبني RESTful API؟')">🌐 REST API</button>
              </div>
              <div class="ai-input-area">
                <textarea class="ai-input" id="chatInput" placeholder="اسأل أي سؤال تقني... (Enter للإرسال، Shift+Enter لسطر جديد)" rows="1"></textarea>
                <button class="ai-send-btn" id="sendBtn" onclick="window.sendAiMsg()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>
                  </svg>
                </button>
              </div>
            </div>

            <div id="reviewPanel" class="code-panel" style="height:100%">
              <div class="ai-header">
                <div class="ai-avatar">🔍</div>
                <div class="ai-header-info">
                  <h2>مراجعة الكود بالذكاء الاصطناعي</h2>
                  <p>الصق كودك وسيقدم المساعد اقتراحات لتحسينه</p>
                </div>
              </div>
              <div class="code-input-area">
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
                  <select class="lang-select" id="codeLanguage">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="typescript">TypeScript</option>
                    <option value="css">CSS</option>
                    <option value="html">HTML</option>
                    <option value="sql">SQL</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                  </select>
                  <button class="saas-btn saas-btn-primary" onclick="window.reviewCode()" id="reviewBtn">🔍 مراجعة الكود</button>
                </div>
                <textarea class="code-textarea" id="codeInput" placeholder="// الصق كودك هنا..."></textarea>
                <div id="reviewResult" style="display:none"></div>
              </div>
            </div>

            <div id="quizPanel" class="quiz-panel">
              <div class="ai-header">
                <div class="ai-avatar">🧪</div>
                <div class="ai-header-info">
                  <h2>اختبار تفاعلي بالذكاء الاصطناعي</h2>
                  <p>اختبر معرفتك بمهارة محددة</p>
                </div>
              </div>
              <div class="quiz-content" id="quizContent">
                <div style="max-width:400px;margin:0 auto;padding:20px">
                  <p style="color:var(--saas-muted);margin-bottom:12px">اختر المهارة التي تريد اختبار معرفتك بها:</p>
                  <select class="lang-select" id="quizSkill" style="width:100%;padding:12px;margin-bottom:12px;font-size:15px">
                    <option value="JavaScript">JavaScript</option>
                    <option value="React">React.js</option>
                    <option value="Python">Python</option>
                    <option value="CSS">CSS</option>
                    <option value="Node.js">Node.js</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="Git">Git</option>
                    <option value="SQL">SQL</option>
                  </select>
                  <select class="lang-select" id="quizDifficulty" style="width:100%;padding:12px;margin-bottom:16px;font-size:15px">
                    <option value="easy">سهل</option>
                    <option value="medium" selected>متوسط</option>
                    <option value="hard">صعب</option>
                  </select>
                  <button class="saas-btn saas-btn-primary" onclick="window.startQuiz()" id="startQuizBtn" style="width:100%;padding:14px">🧪 ابدأ الاختبار</button>
                </div>
              </div>
            </div>

            <div id="careerPanel" style="display:none;flex-direction:column;height:100%;overflow:hidden">
              <div class="ai-header">
                <div class="ai-avatar">🎯</div>
                <div class="ai-header-info">
                  <h2>التوجيه المهني الذكي</h2>
                  <p>مسارات مهنية مقترحة بناءً على مهاراتك</p>
                </div>
              </div>
              <div style="flex:1;overflow-y:auto;padding:24px" id="careerContent">
                <div style="text-align:center;padding:40px">
                  <div style="font-size:48px;margin-bottom:16px">🎯</div>
                  <button class="saas-btn saas-btn-primary" onclick="window.loadCareerGuidance()">تحليل مساري المهني</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.ai-mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
        const activeBtn = document.querySelector('[data-mode="' + mode + '"]');
        if (activeBtn) activeBtn.classList.add('active');
        document.getElementById('chatPanel').style.display = mode === 'chat' ? 'flex' : 'none';
        document.getElementById('reviewPanel').style.display = mode === 'review' ? 'flex' : 'none';
        document.getElementById('quizPanel').style.display = mode === 'quiz' ? 'flex' : 'none';
        document.getElementById('careerPanel').style.display = mode === 'career' ? 'flex' : 'none';
      }

      document.querySelectorAll('.ai-mode-btn[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => switchMode(btn.dataset.mode));
      });

      function appendMsg(role, text) {
        const container = document.getElementById('messagesContainer');
        const welcome = container.querySelector('.welcome-msg');
        if (welcome) welcome.remove();
        const isAI = role === 'ai';
        const div = document.createElement('div');
        div.className = 'msg ' + (isAI ? 'ai' : 'user');
        const safeText = escapeHtml(text)
          .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
          .replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;font-family:monospace">$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br>');
        div.innerHTML = '<div class="msg-avatar">' + (isAI ? '🤖' : '👤') + '</div><div class="msg-bubble">' + safeText + '</div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      }

      function showTyping() {
        const container = document.getElementById('messagesContainer');
        const div = document.createElement('div');
        div.className = 'msg ai';
        div.id = 'typingIndicator';
        div.innerHTML = '<div class="msg-avatar">🤖</div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      }

      function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
      }

      window.sendAiMsg = async function() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        input.value = '';
        input.style.height = '';
        document.getElementById('sendBtn').disabled = true;
        appendMsg('user', msg);
        chatHistory.push({ role: 'user', content: msg });
        showTyping();
        try {
          const data = await S.api('/api/ai/mentor', {
            method: 'POST',
            body: JSON.stringify({ message: msg, history: chatHistory.slice(-10), context: { skill: user.learnSkills ? user.learnSkills[0] : null } }),
          });
          hideTyping();
          appendMsg('ai', data.reply);
          chatHistory.push({ role: 'assistant', content: data.reply });
        } catch (err) {
          hideTyping();
          appendMsg('ai', 'عذراً، حدث خطأ. حاول مرة أخرى.');
        } finally {
          document.getElementById('sendBtn').disabled = false;
        }
      };

      window.quickPrompt = function(msg) {
        switchMode('chat');
        document.getElementById('chatInput').value = msg;
        window.sendAiMsg();
      };

      window.clearChat = function() {
        chatHistory = [];
        const c = document.getElementById('messagesContainer');
        c.innerHTML = '<div class="welcome-msg"><div class="big-icon">🤖</div><h2>محادثة جديدة</h2><p>أنا هنا لمساعدتك!</p></div>';
      };

      document.getElementById('chatInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendAiMsg(); }
      });

      document.getElementById('chatInput').addEventListener('input', function() {
        this.style.height = '';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });

      window.reviewCode = async function() {
        const code = document.getElementById('codeInput').value.trim();
        const lang = document.getElementById('codeLanguage').value;
        if (!code) { S.toast('الصق كوداً أولاً', 'warning'); return; }
        const btn = document.getElementById('reviewBtn');
        btn.textContent = '⏳ جاري المراجعة...';
        btn.disabled = true;
        try {
          const data = await S.api('/api/ai/review-code', { method: 'POST', body: JSON.stringify({ code, language: lang }) });
          const r = data.review;
          const scoreColor = r.score >= 80 ? '#10b981' : r.score >= 60 ? '#f59e0b' : '#ef4444';
          const resultEl = document.getElementById('reviewResult');
          resultEl.style.display = 'block';
          resultEl.innerHTML = '<div class="review-result"><div class="score-ring"><div class="score-circle" style="border-color:' + scoreColor + ';color:' + scoreColor + '">' + r.score + '</div><div><div style="font-weight:700;font-size:16px">درجة الجودة: ' + r.score + '/100</div><div style="color:var(--saas-muted);font-size:13px">' + escapeHtml(r.summary) + '</div></div></div>' +
            (r.suggestions || []).map(function(s) { return '<div class="suggestion ' + s.type + '"><span>' + (s.type==='warning'?'⚠️':s.type==='success'?'✅':'💡') + '</span><span>' + escapeHtml(s.message) + '</span></div>'; }).join('') + '</div>';
        } catch (err) {
          S.toast('خطأ في مراجعة الكود', 'error');
        } finally {
          btn.textContent = '🔍 مراجعة الكود';
          btn.disabled = false;
        }
      };

      window.startQuiz = async function() {
        const skill = document.getElementById('quizSkill').value;
        const difficulty = document.getElementById('quizDifficulty').value;
        const btn = document.getElementById('startQuizBtn');
        btn.textContent = '⏳ جاري التوليد...';
        btn.disabled = true;
        try {
          const data = await S.api('/api/ai/quiz', { method: 'POST', body: JSON.stringify({ skill, difficulty }) });
          quizData = data.quiz;
          quizAnswers = {};
          renderQuiz();
        } catch (err) {
          S.toast('خطأ في توليد الاختبار', 'error');
        } finally {
          btn.textContent = '🧪 ابدأ الاختبار';
          btn.disabled = false;
        }
      };

      function renderQuiz() {
        const letters = ['أ', 'ب', 'ج', 'د'];
        const content = document.getElementById('quizContent');
        const qs = (quizData.questions || []).map(function(q, i) {
          const opts = (q.options || []).map(function(opt, j) {
            return '<div class="quiz-option" onclick="window.selectAnswer(' + i + ',' + j + ')" id="q' + i + 'o' + j + '">' +
              '<div class="quiz-option-letter">' + letters[j] + '</div><span>' + escapeHtml(opt) + '</span></div>';
          }).join('');
          return '<div class="quiz-q" id="q' + i + '"><div class="quiz-q-text">' + (i+1) + '. ' + escapeHtml(q.question) + '</div>' + opts +
            '<div id="q' + i + 'explain" style="display:none;margin-top:12px;padding:10px;background:rgba(16,185,129,.1);border-radius:8px;font-size:13px;color:#10b981"></div></div>';
        }).join('');
        content.innerHTML = '<div style="max-width:600px;margin:0 auto"><h3 style="margin-bottom:20px">اختبار ' + escapeHtml(quizData.skill) + '</h3>' + qs +
          '<button class="saas-btn saas-btn-primary" onclick="window.submitQuiz()" style="width:100%;padding:14px;margin-top:8px">✅ تحقق من الإجابات</button>' +
          '<button class="saas-btn saas-btn-ghost" onclick="window.resetQuiz()" style="width:100%;padding:14px;margin-top:8px">🔄 اختبار جديد</button></div>';
      }

      window.selectAnswer = function(qi, oi) {
        document.querySelectorAll('#q' + qi + ' .quiz-option').forEach(function(el) { el.classList.remove('selected'); });
        const sel = document.getElementById('q' + qi + 'o' + oi);
        if (sel) sel.classList.add('selected');
        quizAnswers[qi] = oi;
      };

      window.submitQuiz = function() {
        if (!quizData) return;
        let correct = 0;
        (quizData.answers || []).forEach(function(ans, i) {
          const selected = quizAnswers[i];
          if (selected !== undefined) {
            const selEl = document.getElementById('q' + i + 'o' + selected);
            if (selEl) selEl.classList.add(selected === ans.correct ? 'correct' : 'wrong');
          }
          const corrEl = document.getElementById('q' + i + 'o' + ans.correct);
          if (corrEl) corrEl.classList.add('correct');
          if (selected === ans.correct) correct++;
          if (ans.explanation) {
            const exp = document.getElementById('q' + i + 'explain');
            if (exp) { exp.textContent = '💡 ' + ans.explanation; exp.style.display = 'block'; }
          }
        });
        const pct = Math.round((correct / quizData.totalQuestions) * 100);
        S.toast('نتيجتك: ' + correct + '/' + quizData.totalQuestions + ' (' + pct + '%)', pct >= 70 ? 'success' : 'info');
      };

      window.resetQuiz = function() {
        quizData = null; quizAnswers = {};
        document.getElementById('quizContent').innerHTML = '<div style="max-width:400px;margin:0 auto;padding:20px"><p style="color:var(--saas-muted);margin-bottom:12px">اختر المهارة:</p><select class="lang-select" id="quizSkill" style="width:100%;padding:12px;margin-bottom:12px"><option value="JavaScript">JavaScript</option><option value="React">React.js</option><option value="Python">Python</option><option value="CSS">CSS</option><option value="Node.js">Node.js</option></select><select class="lang-select" id="quizDifficulty" style="width:100%;padding:12px;margin-bottom:16px"><option value="easy">سهل</option><option value="medium" selected>متوسط</option><option value="hard">صعب</option></select><button class="saas-btn saas-btn-primary" onclick="window.startQuiz()" id="startQuizBtn" style="width:100%;padding:14px">🧪 ابدأ الاختبار</button></div>';
      };

      window.loadCareerGuidance = async function() {
        const content = document.getElementById('careerContent');
        content.innerHTML = '<div style="text-align:center;padding:40px"><div class="typing-indicator" style="display:inline-flex"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
        try {
          const data = await S.api('/api/ai/career', { method: 'POST' });
          const g = data.guidance;
          const paths = (g.recommendedPaths || []).map(function(p) {
            const steps = (p.nextSteps || []).map(function(s) { return '<span class="saas-badge">' + escapeHtml(s) + '</span>'; }).join('');
            return '<div class="saas-card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">' +
              '<div><div style="font-weight:700;font-size:15px">' + escapeHtml(p.title) + '</div>' +
              '<div style="color:var(--saas-muted);font-size:13px">' + escapeHtml(p.salaryRange || '') + ' • ' + escapeHtml(p.timeToAchieve || '') + '</div></div>' +
              '<span class="saas-badge" style="background:linear-gradient(135deg,#b57bee,#8b5cf6);color:white">' + p.match + '% تطابق</span></div>' +
              '<div class="saas-progress" style="height:6px;margin-bottom:8px"><div class="saas-progress-bar" style="width:' + p.match + '%"></div></div>' +
              '<div style="display:flex;flex-wrap:wrap;gap:6px">' + steps + '</div></div>';
          }).join('');
          content.innerHTML = '<div style="max-width:600px;margin:0 auto"><p style="color:var(--saas-muted);margin-bottom:20px;font-size:14px">' + escapeHtml(g.insight || '') + '</p>' +
            '<h4 style="margin-bottom:12px">مسارات مهنية مقترحة:</h4>' + paths +
            '<button class="saas-btn saas-btn-ghost" onclick="window.loadCareerGuidance()" style="width:100%;margin-top:8px">🔄 إعادة التحليل</button></div>';
        } catch (err) {
          content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--saas-muted)">خطأ في تحميل التوجيه المهني. حاول مرة أخرى.</div>';
        }
      };
    })();
  </script>
</body>
</html>
