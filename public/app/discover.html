<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>اكتشف المهارات | شارك</title><meta name="description" content="ابحث عن مهارات ومرشدين مع فلاتر متقدمة على منصة شارك لتبادل المهارات." /><meta name="robots" content="index, follow" /><link rel="canonical" href="https://sharij-532a3.web.app/app/discover.html" /><meta property="og:title" content="اكتشف المهارات | شارك" /><meta property="og:description" content="بحث فوري، اقتراحات، ومرشدون شائعون لتبادل المهارات." /><meta property="og:image" content="https://sharij-532a3.web.app/images/og-cover.jpg" /><link rel="icon" href="/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="/saas/saas.css" />
<link rel="stylesheet" href="/tria-theme.css"><script src="/config.js"></script><style> .filters { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; } .filters select, .filters input { width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--saas-border); background:var(--saas-surface); color:var(--saas-text); font:inherit; } .suggest-row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 18px; } @media (max-width:900px){ .filters{ grid-template-columns:1fr 1fr; } } </style>  <script src="/i18n.js" defer></script><script src="/toast.js" defer></script>
</head><body class="dark saas-app"><div id="saas-root"></div><script src="/saas/saas-shell.js"></script><script src="/saas/skills-data.js"></script><script> (async function () { const S = window.SharikSaaS; const content = S.mountShell("discover"); if (!content) return; const params = new URLSearchParams(location.search); let q = params.get("q") || ""; content.innerHTML = ` <div class="saas-page-head"><div><h1>اكتشف وتعلّم</h1><p>بحث فوري، مهارات رائجة، ومرشدون موثوقون</p></div></div><div class="saas-card"><div class="filters"><input id="qInput" type="search" placeholder="ابحث عن مهارة أو شخص..." value="${S.escapeHtml(q)}" /><select id="category"><option value="">كل التصنيفات</option><option>تطوير الويب</option><option>تصميم</option><option>ذكاء اصطناعي</option><option>أمن المعلومات</option><option>برمجة</option></select><select id="country"><option value="">كل الدول</option><option>مصر</option><option>السعودية</option><option>الإمارات</option><option>الأردن</option></select><select id="language"><option value="">كل اللغات</option><option>العربية</option><option>English</option></select><select id="rating"><option value="0">أي تقييم</option><option value="4">4+ نجوم</option><option value="4.5">4.5+</option></select><select id="difficulty"><option value="">أي مستوى</option><option>مبتدئ</option><option>متوسط</option><option>متقدم</option></select><select id="duration"><option value="">أي مدة</option><option>45</option><option>60</option><option>75</option></select><label style="display:flex;align-items:center;gap:8px;color:var(--saas-muted)"><input type="checkbox" id="online" /> متصل الآن</label></div><div class="suggest-row" id="suggestRow"></div><button class="saas-btn saas-btn-primary" id="runSearch">بحث متقدم</button></div><div class="saas-grid saas-grid-2" style="margin-top:16px"><div class="saas-card"><h2>المهارات</h2><div id="skillsList" class="saas-grid" style="gap:10px"></div></div><div class="saas-card"><h2>المرشدون</h2><div id="mentorsList"></div></div></div> `; async function run() { q = document.getElementById("qInput").value.trim(); const query = new URLSearchParams({ q, category: document.getElementById("category").value, country: document.getElementById("country").value, language: document.getElementById("language").value, rating: document.getElementById("rating").value, difficulty: document.getElementById("difficulty").value, online: document.getElementById("online").checked ? "1" : "0", }); history.replaceState({}, "", "?" + query.toString()); let data; try { data = await S.api("/api/search?" + query.toString()); } catch { const catalog = Object.values(window.SHARIK_SKILLS || {}); data = { skills: catalog .filter((s) => !q || s.title.toLowerCase().includes(q.toLowerCase())) .map((s) => ({ name: s.title, category: s.category, difficulty: s.difficulty, learners: s.learners, id: s.id })), mentors: [], suggested: catalog.slice(0, 6).map((s) => s.title), trending: catalog.slice(0, 8).map((s) => s.title), }; } document.getElementById("suggestRow").innerHTML = `<span style="color:var(--saas-muted);width:100%">مقترحات ورائج:</span>` + (data.trending || data.suggested || []) .map((t) => `<button type="button" class="saas-chip suggest-chip">${S.escapeHtml(t)}</button>`) .join(""); document.querySelectorAll(".suggest-chip").forEach((btn) => { btn.addEventListener("click", () => { document.getElementById("qInput").value = btn.textContent; run(); }); }); const skills = data.skills || []; document.getElementById("skillsList").innerHTML = skills.length ? skills .map((sk) => { const id = sk.id || Object.keys(window.SHARIK_SKILLS || {}).find( (k) => window.SHARIK_SKILLS[k].title.toLowerCase() === String(sk.name).toLowerCase() ) || encodeURIComponent(sk.name); return ` <a class="saas-card" style="box-shadow:none;padding:14px" href="/app/skill.html?id=${id}"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${S.escapeHtml(sk.name)}</strong><span class="saas-chip">${S.escapeHtml(sk.difficulty || "متوسط")}</span></div><div style="color:var(--saas-muted);font-size:.85rem;margin-top:6px">${S.escapeHtml(sk.category || "تقنية")} · ${sk.learners || 0} متعلم</div></a>`; }) .join("") : '<div class="empty-state"><h3>لا نتائج</h3><p>جرّب كلمات أخرى أو أزل الفلاتر</p></div>'; const mentors = data.mentors || []; document.getElementById("mentorsList").innerHTML = mentors.length ? mentors .map( (m) => ` <div style="display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--saas-border)"><div style="display:flex;gap:12px"><div class="saas-avatar">${S.escapeHtml((m.name || "?").charAt(0))}</div><div><strong>${S.escapeHtml(m.name)} ${m.isVerified ? "✓" : ""}</strong><div style="color:var(--saas-muted);font-size:.82rem">${(m.teachSkills || []).slice(0, 3).join(" · ") || "مرشد"}</div><div class="stars" style="font-size:.8rem">${S.stars(m.rating)} ${m.rating || 0}</div></div></div><div style="display:flex;flex-direction:column;gap:6px"><a class="saas-btn saas-btn-soft" href="/login-signup/profile.html?user=${encodeURIComponent(m.email)}">الملف</a><a class="saas-btn saas-btn-primary" href="/app/sessions.html?partner=${encodeURIComponent(m.email)}">جلسة</a></div></div>` ) .join("") : '<div class="empty-state"><p>لا مرشدين مطابقين حالياً — جرّب المطابقة الذكية</p><a class="saas-btn saas-btn-primary" href="/login-signup/matching-results.html">المطابقة</a></div>'; } document.getElementById("runSearch").addEventListener("click", run); document.getElementById("qInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } }); let t; document.getElementById("qInput").addEventListener("input", () => { clearTimeout(t); t = setTimeout(run, 280); }); run(); })(); </script></body></html>
