    <main>
      <div class="signup-container">
        <h3 class="signup-title">إنشاء حساب جديد</h3>

        <form id="signupForm"  method="post" action="/signup.html">
          <div class="signup-form">
            <label for="inputName" class="form-label">الإسم</label>
            <input
              id="inputName"
              class="form-input"
              type="text"
              required
              placeholder="Khaled"
              autocomplete="username"
              name="username1"
            />
            <label for="inputName" class="form-label">إسم العائلة</label>
            <input
              id="inputName2"
              class="form-input"
              type="text"
              required
              placeholder="Refaat"
              autocomplete="username"
              name="username2"
            />

            <label for="inputEmail" class="form-label">البريد الإلكتروني</label>
            <input
              id="inputEmail"
              class="form-input"
              type="email"
              placeholder="example@gmail.com"
              required
              autocomplete="email"
              name="email"
            />

            <label for="inputPassword" class="form-label">كلمة المرور</label>
            <input
              class="form-input"
              type="password"
              placeholder="••••••"
              id="inputPassword"
              required
              autocomplete="new-password"
              name="password"
            />
            <div class="show-password">
              <input
              name="checkbox"
                type="checkbox"
                id="showPw"
                onchange="
                  document.getElementById('inputPassword').type = this.checked
                    ? 'text'
                    : 'password'
                "
              />
              <label for="showPw">إظهار كلمة المرور</label>
            </div>
          </div>

          <div class="terms-section">
            <input
              id="inputCheckbox"
              name="checkbox"
              type="checkbox"
              required
            />
            <label for="inputCheckbox">
              أوافق على
              <a href="#" class="terms-link">الشروط والأحكام</a>
              و<a href="#" class="terms-link">سياسة الخصوصية</a>
            </label>
          </div>

          <button id="inputSubmit" class="signup-button" type="submit">
            إنشاء حساب
          </button>

          <div class="auth-divider">أو</div>

          <p class="login-text">
            لديك حساب بالفعل؟
            <a href="/login-signup/login.html" class="login-link">تسجيل الدخول</a>
          </p>
        </form>
      </div>
      <button
        type="button"
        id="btn"
        aria-label="العودة إلى أعلى الصفحة"
        title="العودة للأعلى"
