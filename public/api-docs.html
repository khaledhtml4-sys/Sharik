 padding: 14px; border-radius: 8px; font-size: 13px; color: #e6edf3; overflow-x: auto; margin: 8px 0; } @media (max-width:700px){.endpoint-head{align-items:flex-start;flex-wrap:wrap}.endpoint-desc{width:100%;line-height:1.5}}.api-container{padding-top:calc(var(--header-h,72px) + 32px)!important}/* api docs shell fixes */</style><link rel="stylesheet" href="/unified-header.css">

 الذكاء الاصطناعي", body: '{\n "code": "const x = 5;",\n "language": "javascript"\n}', res: '{\n "review": {\n "score": 90,\n "suggestions": [...]\n }\n}' }, { tag: "💬 Community Feed", method: "GET", path: "/api/feed", desc: "جلب المنشورات من المجتمع التعليمي مع الفلترة والصفحات", body: 'Query params: ?page=1&limit=10&type=achievement', res: '{\n "posts": [...],\n "total": 42,\n "hasMore": true\n}' }, { tag: "💬 Community Feed", method: "POST", path: "/api/feed/post", desc: "نشر منشور جديد في المجتمع (عام، إنجاز، سؤال، مصدر، مشروع)", body: '{\n "content": "أكملت مشروع React الجديد!",\n "type": "achievement",\n "tags": ["React", "Project"]\n}', res: '{\n "post": { "_id": "...", "content": "..." }\n}' }, { tag: "🛒 Skill Marketplace", method: "GET", path: "/api/marketplace/skills", desc: "البحث وتصفح المهارات المتاحة في السوق", body: 'Query params: ?category=Technology&level=beginner&q=React', res: '{\n "skills": [...],\n "total": 15\n}' }, { tag: "🛒 Skill Marketplace", method: "POST", path: "/api/marketplace/skills", desc: "نشر مهارة جديدة في السوق", body: '{\n "title": "تعلم Node.js",\n "description": "...",\n "category": "Technology",\n "level": "intermediate",\n "duration": 60\n}', res: '{\n "skill": { "_id": "..." }\n}' }, { tag: "📊 Analytics", method: "GET", path: "/api/analytics/me", desc: "جلب تحليلات التعلم الشخصية وخريطة النشاط المستمر", body: "Requires Bearer Token", res: '{\n "heatmap": { "2026-07-25": 3 },\n "skillCoverage": [...],\n "stats": { "learningHours": 24, "completedSessions": 8 }\n}' }, { tag: "🏆 Gamification", method: "GET", path: "/api/gamification/profile", desc: "جلب ملف الإنجازات والدرجات والشارات والتحديات", body: "Requires Bearer Token", res: '{\n "points": 350,\n "level": "محترف",\n "badges": [...],\n "challenges": [...]\n}' }, { tag: "🎓 Certificates", method: "GET", path: "/api/certificates/verify/:certId", desc: "التحقق المباشر من صحة شهادة معتمدة باستخدام المعرف", body: "Public API (No Auth)", res: '{\n "valid": true,\n "certificate": { "holderName": "أحمد محمد", "title": "شهادة توثيق React" }\n}' }, ]; const container = document.getElementById('apiContainer'); let currentTag = ""; endpoints.forEach((ep, i) => { if (ep.tag !== currentTag) { currentTag = ep.tag; const tagTitle = document.createElement('div'); tagTitle.className = 'api-tag'; tagTitle.textContent = currentTag; container.appendChild(tagTitle); } const card = document.createElement('div'); card.className = 'endpoint-card'; card.innerHTML = ` <div class="endpoint-head" onclick="toggleBody(${i})"><span class="method ${ep.method}">${ep.method}</span><span class="endpoint-path">${ep.path}</span><span class="endpoint-desc">${ep.desc}</span></div><div class="endpoint-body" id="body-${i}"><div style="font-weight:700;font-size:13px;margin-bottom:4px">Request:</div><pre>${ep.body}</pre><div style="font-weight:700;font-size:13px;margin:12px 0 4px">Response Example:</div><pre>${ep.res}</pre></div> `; container.appendChild(card); }); function toggleBody(i) { document.getElementById(`body-${i}`).classList.toggle('open'); } </script><footer class="footer" role="contentinfo"><div class="footer-top"><div class="footer-social-title">Social Media</div><div class="footer-social-icons"><a href="#" aria-label="Facebook" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#FFFFFF" d="M15.5 8.5H14c-.6 0-1 .4-1 1V11h2.5l-.3 2.5H13V19h-2.5v-5.5H8V11h2.5V9.2c0-2 1.2-3.2 3.3-3.2h1.7v2.5z"/></svg></a><a href="#" aria-label="TikTok" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#000000"/><path fill="#FFFFFF" d="M15.5 7.5c.8 1.1 2 1.9 3.5 2v2.5c-1.3-.1-2.5-.5-3.5-1.2v4.8c0 2.6-2.1 4.7-4.7 4.7S6.1 18.2 6.1 15.6s2.1-4.7 4.7-4.7c.3 0 .6 0 .9.1v2.6c-.3-.1-.6-.1-.9-.1-1.2 0-2.1.9-2.1 2.1s.9 2.1 2.1 2.1 2.1-.9 2.1-2.1V4h2.5c.1 1 .7 2.4 2.1 3.5z"/></svg></a><a
